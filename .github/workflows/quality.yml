name: quality

on:
  push:
  pull_request:

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install lightweight check dependencies
        run: python -m pip install pyyaml
      - name: Compile Python files
        run: python -m compileall -q eval merge scripts
      - name: Check project integrity
        run: python scripts/check_project.py
      - name: Check committed results
        run: python scripts/check_results.py
